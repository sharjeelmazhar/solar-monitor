# gitleaks config: the default rules plus checks for things that are private to this house.
title = "solar-monitor"

[extend]
useDefault = true

[[rules]]
id = "private-lan-ip"
description = "Home LAN address (192.168.x.x / 10.x.x.x). Use solar.local or <device-ip> in docs instead."
regex = '''\b(192\.168\.(?:[0-9]{1,3})\.(?:[0-9]{1,3})|10\.(?:[0-9]{1,3})\.(?:[0-9]{1,3})\.(?:[0-9]{1,3}))\b'''
[[rules.allowlists]]
description = "ESP32 soft-AP default address used during Wi-Fi setup"
regexes = ['''192\.168\.4\.1''']

[[rules]]
id = "inverter-serial"
description = "Inverter / Wi-Fi module serial numbers from the owner's setup"
regex = '''\b(92492103100394|W0821081948334)\b'''

[[rules]]
id = "hardcoded-password-define"
description = "Password in a #define (belongs in the git-ignored secrets.h)"
regex = '''#define\s+\w*PASS\w*\s+"(?:[^"]{4,})"'''
[[rules.allowlists]]
regexes = ['''change-me-now''', '''pick-an?-[a-z-]*password''']
